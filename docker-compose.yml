# BSFChat production docker-compose.
#
#   cp .env.example .env && $EDITOR .env
#   ./setup.sh            # renders config/*.toml + nginx/bsfchat.conf from .env
#   docker compose up -d
#
# BSFCHAT_TAG in .env picks the release channel: `latest` (stable, the
# default), `latest-beta` (stable + release candidates), `main`
# (development), or a pinned tag. See README.md, "Switching channels".
#
# .env is the only file you edit. Everything under config/ is generated from
# it, so the chat server and coturn cannot drift out of sync — which is how
# TURN ends up "configured" and silently non-functional.
#
# Put a reverse proxy in front of the HTTP services to terminate TLS;
# nginx/bsfchat.conf is generated for you. Suggested routing:
#   CHAT_HOST -> localhost:8448 (chat server)
#   ID_HOST   -> localhost:8480 (identity service)
# coturn is NOT proxied — TURN is not HTTP.

# ---------------------------------------------------------------------------
# Container log retention
# ---------------------------------------------------------------------------
# Docker's default json-file driver has NO size and NO age limit, so without
# this block the chat server's and identity service's own stdout grows under
# /var/lib/docker/containers/ until the disk fills. Neither logrotate/nginx nor
# ./backup.sh touches it — those cover a different log. A daemon-wide default in
# /etc/docker/daemon.json would also work; it lives here instead so the numbers
# are committed, reviewable, and applied by `docker compose up -d` rather than
# by a host file nobody remembers editing.
#
# READ THIS BEFORE QUOTING A RETENTION PERIOD ANYWHERE. This is a SIZE bound,
# not an age bound. json-file exposes max-size, max-file and compress and
# nothing else — `max-age` and `max-file-age` are rejected by the daemon as
# unknown options (verified against Docker 29.0.1). So a busy server discards
# lines in days and a quiet one can keep them for the better part of a year.
# Do not write "we keep container logs for N days" on the strength of this
# block. If you need an actual period, see "Container logs" in README.md: it
# takes the journald driver plus MaxRetentionSec on the host, and that is a
# different trade, not a bigger number here.
#
# Why 10m x 3. The ceiling is max-size x max-file — the live file counts as one
# of them — so 30 MB per service, 60 MB for the two that log. Measured, not
# guessed: json-file wraps every line in
# {"log":"...","stream":"stdout","time":"<RFC3339Nano>"}, a fixed 68 bytes on
# top of the line itself. A representative line here —
# "[2026-09-28 14:22:01.123] [info] User @alice:chat.bsfchat.com joined voice in
# room !GtKqPZmXvNwRbYcD:chat.bsfchat.com" — is about 113 bytes, so ~181 on
# disk, and 30 MB holds roughly 165,000 of them. At the few hundred lines a day
# a small instance actually produces that is months of history; at the ~580
# lines a day a permanently unreachable identity provider adds (the OIDC retry
# backoff caps at 300s) it is still months. It is sized to survive a bad day
# without being the reason a 25 GB VPS fills up.
#
# Override per host in .env if you want more history; the defaults apply when
# the variables are unset.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${BSFCHAT_LOG_MAX_SIZE:-10m}"
    max-file: "${BSFCHAT_LOG_MAX_FILE:-3}"

services:
  server:
    image: ghcr.io/bsfchat/server:${BSFCHAT_TAG:-latest}
    container_name: bsfchat-server
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8448:8448"
    volumes:
      - ./data/server:/data
      - ./config/server.toml:/etc/bsfchat/server.toml:ro
    # No healthcheck here on purpose: the image ships its own, which curls
    # GET /_matrix/client/versions. The probe this block used to hold only
    # opened a TCP connection, which a wedged server with every worker
    # parked on a /sync long-poll still accepts. Overriding it here would
    # put that weaker check back.

  identity:
    image: ghcr.io/bsfchat/identity:${BSFCHAT_TAG:-latest}
    container_name: bsfchat-identity
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8480:8480"
    volumes:
      - ./data/identity:/data
      - ./config/identity.toml:/etc/bsfchat/identity.toml:ro
    # As above: the image's own healthcheck requests
    # /.well-known/openid-configuration, which goes through the router.

  # coturn: STUN/TURN relay for voice NAT traversal. Without it, users behind
  # symmetric NAT or CGNAT cannot connect to voice at all — leave it enabled.
  #
  # Firewall: TURN_PORT tcp+udp, plus the whole TURN_MIN_PORT-TURN_MAX_PORT
  # udp relay range (~2000 ports by default). A call of N people allocates
  # N*(N-1)*2 relay ports, so a range of a few dozen is exhausted by one
  # small call and every subsequent allocation fails silently.
  coturn:
    # Pinned, not :latest — coturn is internet-facing and terminates
    # untrusted UDP/TCP. 4.11.0 clears the 2025-2026 advisories:
    # CVE-2025-69217 (predictable nonces via libc random()),
    # CVE-2026-43994 (OAuth-GCM stack overflow), CVE-2026-43915
    # (web-admin stored XSS). Bump deliberately, re-checking advisories.
    image: coturn/coturn:${COTURN_TAG:-4.11.0}
    container_name: bsfchat-coturn
    restart: unless-stopped
    # Present for uniformity and to catch a future config change, NOT because
    # coturn currently fills this file. As shipped it writes nothing at all to
    # stdout: it opens its own log and, running as nobody, falls back from
    # /var/log to /var/tmp/turn_<pid>_<date>.log INSIDE the container, where
    # `docker logs` cannot see it and this block cannot bound it. That file is
    # cleared only when the container is recreated, which under
    # `restart: unless-stopped` can be months. At the verbosity this config
    # uses it holds startup banner lines and the server's own listener and
    # relay addresses — no client addresses, no usernames, no session lines;
    # those appear only with `verbose`. Turn verbosity up and you are creating
    # an unbounded log of who called whom that nothing here rotates.
    logging: *default-logging
    # Host networking: publishing ~2000 UDP ports through the bridge would
    # spawn a userland proxy per port, and coturn would still advertise the
    # container address as the relay candidate.
    network_mode: host
    volumes:
      - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # The image runs as nobody:nogroup (65534), not root. ./setup.sh chowns the
    # rendered turnserver.conf to that uid and gives it mode 0640, because the
    # file now carries the TURN shared secret. If coturn exits complaining it
    # cannot read its config, that chown is what failed — setup.sh says so when
    # it cannot do it.
    #
    # static-auth-secret is NOT passed here. It used to be, on the reasoning
    # that a secret in argv beats a secret at rest — but with network_mode:
    # host, argv is readable by every local user through `ps aux`,
    # /proc/<pid>/cmdline, `docker inspect` and `docker compose config`, which
    # is strictly worse than a 0640 file. It lives in turnserver.conf now; see
    # the note at the top of config/turnserver.conf.template.
    #
    # external-ip stays here: it is a public IP, not a secret, and the `:?`
    # guard makes `docker compose up` abort with the message below rather than
    # start a relay that looks healthy and silently drops all media. The
    # equivalent guard for TURN_SECRET now lives in ./setup.sh, which generates
    # the secret and refuses to render a config without one — and which you
    # have to run before this file works at all.
    command: >
      -c /etc/coturn/turnserver.conf
      --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is unset. Put this machine public IPv4 in .env (curl -4 https://ifconfig.me) and run ./setup.sh, or every relayed call fails silently.}
    healthcheck:
      # Unauthenticated STUN binding request against ourselves. turnutils_*
      # ship inside the official coturn image; if a future tag drops them,
      # this reports unhealthy while the relay is fine — check with
      # `docker compose exec coturn command -v turnutils_stunclient`.
      test: ["CMD-SHELL", "turnutils_stunclient -p ${TURN_PORT:-3478} 127.0.0.1 >/dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
